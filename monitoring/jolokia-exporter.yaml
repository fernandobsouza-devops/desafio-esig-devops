apiVersion: apps/v1
kind: Deployment
metadata:
  name: jolokia-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jolokia-exporter
  template:
    metadata:
      labels:
        app: jolokia-exporter
    spec:
      containers:
      - name: jolokia-exporter
        image: python:3.9-slim
        command: ["python", "-m", "http.server", "9779"]
        ports:
        - containerPort: 9779
---
apiVersion: v1
kind: Service
metadata:
  name: jolokia-exporter-service
  namespace: default
spec:
  ports:
  - port: 9779
    targetPort: 9779
  selector:
    app: jolokia-exporter
