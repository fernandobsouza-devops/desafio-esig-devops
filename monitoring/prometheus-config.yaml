apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'jolokia'
        metrics_path: '/jolokia/read'
        static_configs:
          - targets: ['jenkins-jolokia-service:8778']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter-service:9100']