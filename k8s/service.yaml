apiVersion: v1
kind: Service
metadata:
  name: jenkins-jolokia-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: jenkins-jolokia
  ports:
    - name: http-jenkins
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: http-jolokia
      protocol: TCP
      port: 8778
      targetPort: 8778
      nodePort: 30778